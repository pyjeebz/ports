name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance: each package says which workflow built it

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # npm: the same archives goreleaser just built and checksummed, as
      # @pyjeebz/ports and one package per platform
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # trusted publishing: npm checks this workflow's OIDC identity, so no
      # token is stored and nothing bypasses 2FA. Each @pyjeebz/ports*
      # package names this repo and release.yml as its trusted publisher
      # on npmjs.com; npm 11.5 or newer does the exchange.
      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1
          node tools/npm/build.mjs "${GITHUB_REF_NAME#v}" dist npm-out
          sh tools/npm/publish.sh npm-out
