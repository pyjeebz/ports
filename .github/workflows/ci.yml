name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Run tests
        run: go test ./internal/... ./cmd/...
      - name: Build
        run: go build -v .

  # The integration harness builds the real binary and runs it against
  # real listeners — linux only, where the fixtures are cheapest to host.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Run integration tests
        run: go test ./test/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ports.tools/install serves the web copy, the GitHub raw URL the
      # root one — the two must be the same script
      - name: Installer copies match
        run: |
          cmp install.sh web/app/install/script.sh
          sh -n install.sh
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Formatted
        run: |
          unformatted=$(gofmt -l main.go cmd internal test tools)
          [ -z "$unformatted" ] || { echo "gofmt needed:"; echo "$unformatted"; exit 1; }
      - name: Vet
        run: go vet ./internal/... ./cmd/... ./test/... ./tools/...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: ./internal/... ./cmd/... ./test/... ./tools/...